when:
  - event: ["pull_request", "manual"]

engine: microvm
image: nixos

caches:
  https://nix-community.cachix.org: "nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs="

dependencies:
  - cargo
  - cargo-audit
  - clippy
  - cocogitto
  - gcc
  - openssl
  - pkg-config
  - rustc
  - rustfmt

steps:
  - name: "cargo fmt"
    command: cargo fmt --all -- --check
  - name: "cargo clippy"
    command: cargo clippy --all-features
  - name: "cargo check"
    command: cargo check
  - name: "cargo audit"
    command: cargo audit
  - name: "cargo test"
    command: cargo test
    environment:
      RUST_BACKTRACE: "1"
  - name: "cog check"
    command: |
      git fetch --unshallow origin
      git fetch --tags --prune --prune-tags
      cog check --from-latest-tag
