when:
  - event: ["push", "pull_request"]

engine: microvm
image: nixos

dependencies:
  - gcc
  - cargo
  - rustc
  - clippy
  - rustfmt
  - cargo-audit
  - pkg-config
  - openssl

steps:
  - name: "Format check"
    command: cargo fmt --all -- --check
  - name: "Clippy"
    command: cargo clippy --all-features
  - name: "Check"
    command: cargo check
  - name: "Audit"
    command: cargo audit
  - name: "Test"
    command: RUST_BACKTRACE=1 cargo test
