when:
  - event: ["pull_request", "manual"]

engine: microvm
image: nixos

dependencies:
  - gcc
  - cocogitto
  - cargo
  - rustc
  - clippy
  - rustfmt
  - cargo-audit
  - pkg-config
  - openssl

steps:
  - name: "cog check"
    command: cog check --from-latest-tag
  - name: "cargo fmt"
    command: cargo +nightly fmt --all -- --check
  - name: "cargo clippy"
    command: cargo +nightly clippy --all-features
  - name: "cargo check"
    command: cargo +nightly check
  - name: "cargo audit"
    command: cargo +nightly audit
  - name: "cargo test"
    command: RUST_BACKTRACE=1 cargo test
