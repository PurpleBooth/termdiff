when:
  - event: [ "push", "manual" ]
    branch: [ "main" ]

engine: microvm
image: nixos

caches:
  https://nix-community.cachix.org: "nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs="

dependencies:
  - cargo
  - cargo-audit
  - cargo-edit
  - clippy
  - cocogitto
  - gcc
  - openssl
  - pkg-config
  - rustc
  - rustfmt

steps:
  - name: "cog check"
    command: |
      git fetch --unshallow origin
      git fetch --tags --prune --prune-tags
      cog check --from-latest-tag
  - name: "cargo fmt"
    command: cargo fmt --all -- --check
  - name: "cargo clippy"
    command: cargo clippy --all-features
  - name: "cargo check"
    command: cargo check
  - name: "cargo audit"
    command: cargo audit
  - name: "cargo test"
    command: cargo test
    environment:
      RUST_BACKTRACE: "1"
  - name: 'ssh-key > ~/.ssh/id_ed25519'
    command: |
      git switch "$TANGLED_REPO_DEFAULT_BRANCH"
      mkdir -p ~/.ssh/
      echo "$PUSH_SSH_KEY" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      git config core.sshCommand 'ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_ed25519'
      git config user.name "$TANGLED_REPO_NAME Pipeline"
      git config user.email "$TANGLED_REPO_DID"
      git remote set-url origin "git@${TANGLED_REPO_KNOT}:${TANGLED_REPO_DID}"
  - name: "cog bump"
    command: cog bump --auto
