[package]
name = "termdiff"
description = "Write a diff with color codes to a string"
version = "4.2.2"
edition = "2018"
license = "CC0-1.0"
repository = "https://tangled.org/billie.codes/termdiff"
keywords = ["diff", "terminal", "text", "comparison"]
categories = ["development-tools", "text-processing"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["myers", "similar", "arrows", "arrows_color", "signs", "signs_color"]
myers = []
similar = ["dep:similar"]
arrows = []
arrows_color = ["dep:crossterm"]
signs = []
signs_color = ["dep:crossterm"]

[dependencies]
similar = { version = ">=2.7.0, <=3.2.0", features = ["inline"], optional = true }
crossterm = { version = ">=0.28.0, <=0.29.0", optional = true }
[profile.release-max]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
strip = "symbols"


[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "diff_benchmark"
harness = false
