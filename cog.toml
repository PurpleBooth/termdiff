tag_prefix = "v"
from_latest_tag = true
ignore_merge_commits = true
branch_whitelist = ["main", "HEAD"]
pre_bump_hooks = [
    "cargo set-version --workspace {{version}}",
    "cargo build --release",
]
post_bump_hooks = [
    "cog changelog > /tmp/changelog.txt",
    "git tag {{version_tag}} {{version_tag}}^{} --force --sign --annotate --message='Release {{version}}' --message=\"$(cat /tmp/changelog.txt)\"",
    "git push origin HEAD:main",
    "git push origin {{version_tag}}",
    "cargo publish"
]
pre_package_bump_hooks = []
post_package_bump_hooks = []

[git_hooks]

[commit_types]
